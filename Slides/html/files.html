# The Python Standard Library

While Python ships with many "built-in" functions it falls well short of what is needed to build something useful. Python maintains this idea of being **batteries included**. So, it ships with a whole lot of code that you can use to make your life easier. They ship in modules called **libraries**, although the terms module and library can be used interchangeably. There are over 200 of them here are some of the more useful ones...

* `os` - Dealing with the operating system
* `re` - Writing and executing regular expressions
* `datetime` - Dealing with dates, time, timezones, etc
* `math` - Math functions
* `csv` - Reading and writing csv files
* `json` - Reading and writing json files

---
class: middle

# The Python Standard Library vs PIP

While there are hundreds of libraries in the Python standard library there are tens of thousands of libraries in the Python package installer, known as PIP. PIP and the standard library differ in the following ways...

* PIP packages need to be installed by the user, standard library libraries come with Python
* Standard Library libraries are maintained by the Python Software Foundation and PIP libraries are maintained by 3rd parties
* Standard Library packages are well tested and well documented on the Python website and PIP package reliability, testing and  documentation is up to the third party developers.

# Importing a Python Library

Importing a library is dead simple in Python.

```python
import time            # Bring in the time module
```

Each library is simply some Python code that you can use, they can ship with classes, functions, variables, etc for you to use as you wish. Accessing components of these libraries is done with the **dot operator**.

```python
time.localtime()   # Call the localtime function
```
```
time.struct_time(tm_year=2020, tm_mon=4, tm_mday=2, tm_hour=14, tm_min=20, tm_sec=56, tm_wday=3, tm_yday=93, tm_isdst=0)
```

# Importing a Python Library

If for some reason you only want a piece of a particular library you can use the from syntax.

```python

You no longer need the dot operator to get into the time module. In fact, the time module isn't even addressable using this for of importing.

# File Paths

A **pathname** (or path) is a string of characters that gets you to a specific directory or file in your file system. For example, the pathname of the Desktop on Mac is `/Users/brucepucci/Desktop`.

Directories (or folders) in a file path are separated by a slash (/). Every item on your filesystem has an addressable path.

If you had a file on your desktop named `my_file.py`, it's pathname is `/Users/brucepucci/Desktop/my_file.py`.

---
class: middle

# Absolute vs. Relative Paths

A path like `/Users/brucepucci/Desktop` is an **absolute path** because it give you the entirety of the path from the root (`/`) of the file system to where the actual subject is located. An absolute path always refers to the same place no matter where in the system you reference it from.

A **relative path** references a location relative to the place where you currently are in the file system. Relative paths do not start at the root of the filesystem, they start from where you currently are.

---
class: middle

# Absolute vs. Relative Paths

For example, if I am running a command from `/Users/brucepucci` and want to access a file at `/Users/brucepucci/Desktop/my_file.py`...

 * Relative path: `Desktop/my_file.py`
 * Absolute path: `/Users/brucepucci/Desktop/my_file.py`

Any valid path that does not begin with a slash is a relative path.

---
class: middle

# Some relative path syntax

A single dot (.) at the beginning of a path references the path that you are currently in.

2 dots (..) at the beginning of a references the ***parent path***, aka 1 path up from here.

`./my_file.py` : Relative path to my_file.py from the path we are currently operating in

`../my_file.py` : Relative path to my_file.py one directory up from the path we are currently operating in

# Filename Extention

If a file path is an actual file and not a folder it will typically end with a dot and a few characters. This is known as the "filename exxtension" or "file extensions. It doesn't do anything special to the file, it's just a way of communicating what type of file it is. Some examples of file extensions are...

* .html - HTML source file
* .xlsx - Microsoft Excel file
* .csv - Comma Separated Values Files
* .txt - Plain text file
* .json - JavaScript Object Notation file
* .py - Python source file

---
class: middle

# "Plain Text"

A file is considered a "plain text" file if it can be read and edited with a simple text editor. Meaning it cannot contain any "meta" information about it's contents.

| Plain Text Files  | Non-Plain Text Files |
|-------------------|----------------------|
| Plain Text (.txt) | Rich Text (.rtf)     |
| Python (.py)      | Executable (.exe)    |
| JSON (.json)      | Application (.app)   |
| SQL (.sql)        | Excel (.xlsx)        |
| HTML (.html)      | Word (.docx)         |
| CSV (.csv)        | PowerPoint (.pptx)   |

**Why do we care?** It is simple to read and write plain text files using base Python. To read and write other formats we need to use libraries.

# The `open()` Function

`open(file, mode='r', buffering=-1, encoding=None, errors=None, newline=None, closefd=True, opener=None)`

**Parameters**

* file: The path and name of the file
* mode: A string, define which mode you want to open the file in:
  * "r" - Read - Default value. Opens a file for reading, error if the file does not exist
  * "a" - Append - Opens a file for appending, creates the file if it does not exist
  * "w" - Write - Opens a file for writing, creates the file if it does not exist
  * "x" - Create - Creates the specified file, returns an error if the file exist

---
class: middle

# File Object Methods

* `close()` - Closes the file
  * `my_file.close()`
* `read()` - Read the file contents to a string
  * `my_file.read()`
* `readlines()` - Read the file contents to a list of strings, split by newlines
  * `my_file.readlines()`
* `write()` - Write a string to a file
  * `my_file.write('This string will get written')`
* `writelines()` - Write a list of strings to a file with newlines in-between elements
  * `my_file.writelines(['This string will get written', 'So will this one'])`
